name: Borsa

on:
  schedule:
    # GitHub usa sempre l'ora UTC. L'Italia è UTC+1 d'inverno e UTC+2 d'estate,
    # quindi ogni appuntamento ha due orari e il programma esce subito da quello sbagliato.
    - cron: '0 7,8 * * 1-5'        # bollettino del mattino, ore 9:00 italiane
    - cron: '15 16,17 * * 1-5'     # bollettino della sera, ore 18:15 italiane
    - cron: '20 7-20 * * 1-5'      # controllo del giorno: manda solo se c'è un movimento grosso
  workflow_dispatch:
    inputs:
      modo:
        description: 'Cosa eseguire'
        type: choice
        default: 'bollettino mattina'
        options: ['bollettino mattina', 'bollettino sera', 'avviso']
      riserva:
        description: 'Lancio di riserva dal Mac: rispetta finestra e anti-doppione'
        type: boolean
        default: false

concurrency:
  group: bollettino
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pubblica:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci --omit=dev

      - name: Decidi cosa eseguire
        id: scelta
        run: |
          case "${{ github.event.schedule }}" in
            "0 7,8 * * 1-5")     echo "modo=bollettino mattina" >> "$GITHUB_OUTPUT" ;;
            "15 16,17 * * 1-5")  echo "modo=bollettino sera"    >> "$GITHUB_OUTPUT" ;;
            "20 7-20 * * 1-5")   echo "modo=avviso"             >> "$GITHUB_OUTPUT" ;;
            *)                   echo "modo=${{ inputs.modo || 'bollettino mattina' }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Genera e invia
        env:
          VAPID_PUBBLICA:  ${{ secrets.VAPID_PUBBLICA }}
          VAPID_PRIVATA:   ${{ secrets.VAPID_PRIVATA }}
          VAPID_CONTATTO:  ${{ secrets.VAPID_CONTATTO }}
          # Senza questa chiave l'agente non parte e le schede delle aziende
          # restano alle frasi di base: il bollettino esce lo stesso.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ISCRIZIONE_PUSH:   ${{ secrets.ISCRIZIONE_PUSH }}
          ISCRIZIONE_PUSH_2: ${{ secrets.ISCRIZIONE_PUSH_2 }}
          ISCRIZIONE_PUSH_3: ${{ secrets.ISCRIZIONE_PUSH_3 }}
          ISCRIZIONE_PUSH_4: ${{ secrets.ISCRIZIONE_PUSH_4 }}
          # Il lancio di riserva dal Mac si comporta come una partenza programmata:
          # rispetta la finestra oraria e non ripubblica un bollettino già fatto.
          DA_CALENDARIO:   ${{ (github.event_name == 'schedule' || inputs.riserva) && '1' || '' }}
        run: node engine/esegui.mjs ${{ steps.scelta.outputs.modo }}

      - name: Salva i dati aggiornati
        run: |
          if [ -z "$(git status --porcelain docs/data)" ]; then
            echo "Niente di nuovo da salvare."
            exit 0
          fi
          git config user.name  "Borsa"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          # Anche quando non si pubblica un bollettino i prezzi si aggiornano:
          # il messaggio dice quello che è successo davvero.
          if git diff --cached --name-only | grep -q 'docs/data/storico/'; then
            git commit -m "Bollettino del $(TZ=Europe/Rome date '+%d/%m/%Y alle %H:%M')"
          else
            git commit -m "Prezzi aggiornati il $(TZ=Europe/Rome date '+%d/%m/%Y alle %H:%M')"
          fi
          git push
